[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "stratum-ai" # PyPi name
version = "0.0.0.dev2"
description = "skrub with a Rust backend"
readme = "README.md"
authors = [{name = "Arnab Phani"}, {name = "Elias Strauss"},]
license = {text = "Apache-2.0"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.11"
dependencies = [
    "scikit-learn==1.8",
    "pandas==3.0.2",
    "skrub==0.8.0",
    "polars",
    "graphviz",
    "pygments>=2.20.0",
    "urllib3>=2.7.0",
    "idna>=3.15",
    "duckdb>=1.5.4",
    "numexpr>=2.14.1",
    "pillow>=12.3.0",
    "pyarrow>=23.0.1",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "pytest-cov",
    "coverage[toml]",
    "lightgbm>=4.6.0",
    "xgboost>=3.1.1",
]
# torch is only needed by tests/application/test_ttt_task.py, and which build of
# it you want depends on the machine, so it rides in its own extra rather than
# in `test`. Pick exactly one alongside `test`: `cpu` on CI and on any box
# without an NVIDIA GPU, `cu126` on the GPU box. They are declared conflicting
# below so uv resolves a separate lock branch for each.
cpu = [
    "torch>=2.13.0",
]
cu126 = [
    "torch>=2.13.0",
]
benchmark = [
    "psutil>=7.2"
]
dev = [
    "ipykernel>=7.3.0",
]

[project.urls]
Homepage = "https://github.com/deem-data/stratum"
Issues = "https://github.com/deem-data/stratum/issues"

[tool.maturin]
manifest-path = "_rust/Cargo.toml"
module-name = "stratum._rust_backend_native"
python-source = "."

[tool.uv]
# Tell uv to rebuild when Rust source files change
cache-keys = [
    {file = "pyproject.toml"},
    {file = "_rust/Cargo.toml"},
    {file = "_rust/Cargo.lock"},
    {file = "_rust/**/*.rs"},
]
# The `cpu` / `cu126` torch extras are mutually exclusive; see the note above
# the pytorch indexes below.
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]

# The default PyPI torch wheel is built against CUDA 13.0, which the GPU box's
# driver (12.7) refuses -- torch.cuda.is_available() comes back False and every
# pipeline silently falls back to CPU. That box needs the cu126 build.
#
# CI does not: `torch+cu126` drags in 16 nvidia/triton wheels totalling ~2.8 GB
# on each of the four Linux jobs, and none of them has a GPU. `torch+cpu` has no
# nvidia dependencies at all. A `sys_platform` marker cannot tell the two Linux
# machines apart, so the choice is made by extra instead -- hence the conflict
# declaration, which makes uv lock a branch per flavour.
#
# Both sources stay gated on Linux: neither index publishes macOS arm64 wheels,
# so macOS and Windows resolve torch from PyPI (MPS / CPU builds) under either
# extra.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu126", extra = "cu126", marker = "sys_platform == 'linux'" },
]

[dependency-groups]
dev = [
    "maturin>=1.10.1",
]

[tool.coverage.run]
source = ["stratum"]
omit = [
    "**/tests/**",
    "*/__pycache__/*",
    "*/_rust_backend_native.*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"
