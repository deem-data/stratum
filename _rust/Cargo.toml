[package]
name = "skrub_rust"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[profile.dev]
debug = 2     # full debug info
opt-level = 0

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "skrub_rust"
crate-type = ["cdylib"]

[dependencies]
# Python 3.11 ABI for the project's supported CPython versions
pyo3 = { version = ">=0.29.0", features = ["extension-module", "abi3-py311"] }
numpy = { version = ">=0.29,<0.30" }
ahash = "0.8.12"
anyhow = "1.0.99"
ndarray = { version = "0.16.1", features = ["rayon"] }
rand = "0.9.3"
ndarray-linalg = { version = "0.17.0", features = ["intel-mkl-static"] }
rayon = "1.11.0"
once_cell = "1.21.3"
faer = { version = "0.23.2" }
tar = "0.4.46"
rustls-webpki = "0.103.13"
