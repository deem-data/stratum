name: Python Tests

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'examples/**'
      - 'benchmarks/**'
      - '.gitignore'
      - 'LICENSE'
      - '.github/copilot-instructions.md'
      - '.github/instructions/**'
    branches: [main, master]
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'examples/**'
      - 'benchmarks/**'
      - '.gitignore'
      - 'LICENSE'
      - '.github/copilot-instructions.md'
      - '.github/instructions/**'
    branches: [main, master]
  workflow_dispatch:

jobs:
  discover-tests:
    name: Discover Python test suites
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      coverage-files: ${{ steps.matrix.outputs.coverage-files }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Discover trajectories and build test matrix
        id: matrix
        run: python3 .github/scripts/python_test_matrix.py

  python-test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}${{ matrix.suite != 'regular' && format(' / {0}', matrix.suite) || '' }}
    needs: discover-tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-tests.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OS specific dependencies
        if: matrix.os == 'macos-26'
        # Skip `brew update` and dependent upgrades: they pull formula versions
        # newer than the runner image ships, which then build from source.
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: brew install libomp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            _rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('_rust/Cargo.lock') }}

      - name: Create virtual environment with uv
        run: uv venv

      - name: Install maturin
        run: uv pip install maturin

      - name: Build Rust extension
        shell: bash
        working-directory: _rust
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            source ../.venv/Scripts/activate
          else
            source ../.venv/bin/activate
          fi
          maturin develop --release

      - name: Install project with test dependencies
        # `cpu` pins the CPU torch build: the runners have no GPU, and the
        # cu126 build would pull ~2.8 GB of nvidia wheels on every Linux job.
        run: uv sync --extra test --extra cpu --extra hardware

      - name: Run Python tests
        shell: bash
        env:
          TEST_SUITE: ${{ matrix.suite }}
          TEST_PATH: ${{ matrix.path }}
          TRAJECTORY_SELECTOR: ${{ matrix.selector }}
          COLLECT_COVERAGE: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
          COVERAGE_FILE: .coverage.${{ matrix.suite }}
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          args=(-v "$TEST_PATH")
          if [ "$TEST_SUITE" == "regular" ]; then
            args+=(--ignore=tests/application/trajectories)
          else
            args+=(--trajectory-selector="$TRAJECTORY_SELECTOR")
          fi
          if [ "$COLLECT_COVERAGE" == "true" ]; then
            args+=(--cov --cov-config=pyproject.toml --cov-branch --cov-report=term-missing)
          fi
          # A trajectory replays sequentially on one module-scoped reuse cache.
          python -m pytest "${args[@]}"

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.suite }}
          path: .coverage.${{ matrix.suite }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  coverage-check:
    name: Coverage Threshold Check
    runs-on: ubuntu-latest
    needs: [discover-tests, python-test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install locked coverage version
        # Reporting needs no ML dependencies or Rust build.
        run: |
          python - <<'PY' > coverage-requirements.txt
          import tomllib

          with open('uv.lock', 'rb') as stream:
              lock = tomllib.load(stream)
          version = next(p['version'] for p in lock['package'] if p['name'] == 'coverage')
          print(f'coverage[toml]=={version}')
          PY
          uv venv
          uv pip install -r coverage-requirements.txt

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          path: coverage-data
          merge-multiple: true

      - name: Require coverage from every suite
        env:
          EXPECTED_COVERAGE_FILES: ${{ needs.discover-tests.outputs.coverage-files }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = set(json.loads(os.environ['EXPECTED_COVERAGE_FILES']))
          actual = {path.name for path in Path('coverage-data').glob('.coverage.*')}
          if actual != expected:
              raise SystemExit(f'Coverage inputs differ: missing={expected - actual}, unexpected={actual - expected}')
          PY

      - name: Combine coverage
        run: |
          .venv/bin/python -m coverage combine coverage-data
          .venv/bin/python -m coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-ubuntu-py3.12
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage.xml
          if-no-files-found: error
          retention-days: 1

      - name: Check coverage threshold
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          import sys
          
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          
          # Get coverage percentage from XML
          line_rate = float(root.get('line-rate', 0))
          branch_rate_str = root.get('branch-rate')
          
          if branch_rate_str is not None:
              branch_rate = float(branch_rate_str)
              coverage_percent = (line_rate + branch_rate) / 2 * 100
              print(f'Line coverage: {line_rate * 100:.2f}%')
              print(f'Branch coverage: {branch_rate * 100:.2f}%')
              print(f'Overall coverage: {coverage_percent:.2f}%')
          else:
              # Fallback to line coverage only if branch coverage not available
              coverage_percent = line_rate * 100
              print(f'Line coverage: {line_rate * 100:.2f}%')
              print(f'Branch coverage: Not available (use --cov-branch flag)')
              print(f'Overall coverage: {coverage_percent:.2f}% (line coverage only)')
          
          # Coverage threshold (adjust as needed)
          threshold = 80.0
          print(f'Threshold: {threshold}%')
          
          if coverage_percent < threshold:
              print(f'ERROR: Coverage {coverage_percent:.2f}% is below threshold {threshold}%')
              sys.exit(1)
          else:
              print(f'SUCCESS: Coverage {coverage_percent:.2f}% meets threshold {threshold}%')
          "

  python-tests-complete:
    name: Python Tests Complete
    runs-on: ubuntu-latest
    needs: [discover-tests, python-test, coverage-check]
    if: always()
    steps:
      - name: Require all Python checks to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          failed = {name: job['result'] for name, job in json.loads(os.environ['RESULTS']).items()
                    if job['result'] != 'success'}
          if failed:
              raise SystemExit(f'Python checks did not succeed: {failed}')
          PY
