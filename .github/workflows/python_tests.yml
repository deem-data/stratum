name: Python Tests

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'examples/**'
      - 'benchmarks/**'
      - '.gitignore'
      - 'LICENSE'
      - '.github/copilot-instructions.md'
      - '.github/instructions/**'
    branches: [main, master]
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'examples/**'
      - 'benchmarks/**'
      - '.gitignore'
      - 'LICENSE'
      - '.github/copilot-instructions.md'
      - '.github/instructions/**'
    branches: [main, master]
  workflow_dispatch:

jobs:
  python-test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-26
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OS specific dependencies
        if: matrix.os == 'macos-26'
        # Skip `brew update` and dependent upgrades: they pull formula versions
        # newer than the runner image ships, which then build from source.
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: brew install libomp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            _rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('_rust/Cargo.lock') }}

      - name: Create virtual environment with uv
        run: uv venv

      - name: Install maturin
        run: uv pip install maturin

      - name: Build Rust extension
        shell: bash
        working-directory: _rust
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            source ../.venv/Scripts/activate
          else
            source ../.venv/bin/activate
          fi
          maturin develop --release

      - name: Install project with test dependencies
        # `cpu` pins the CPU torch build: the runners have no GPU, and the
        # cu126 build would pull ~2.8 GB of nvidia wheels on every Linux job.
        run: uv sync --extra test --extra cpu --extra hardware

      - name: Run Python tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: bash
        run: |
          source .venv/bin/activate
          pytest -v --cov=stratum --cov-config=pyproject.toml --cov-branch --cov-report=term-missing --cov-report=xml tests

      - name: Run Python tests
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.12'
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          pytest -v tests

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-ubuntu-py3.12
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage.xml
          retention-days: 1

  coverage-check:
    name: Coverage Threshold Check
    runs-on: ubuntu-latest
    needs: python-test
    if: needs.python-test.result == 'success'
    
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Check coverage threshold
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          import sys
          
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          
          # Match coverage.py / pytest-cov: weight by executable opportunities.
          lines_covered = int(root.attrib['lines-covered'])
          lines_valid = int(root.attrib['lines-valid'])
          branches_covered = int(root.get('branches-covered', 0))
          branches_valid = int(root.get('branches-valid', 0))
          total = lines_valid + branches_valid
          if total == 0:
              print('ERROR: Coverage report contains no executable lines or branches')
              sys.exit(1)
          coverage_percent = 100 * (lines_covered + branches_covered) / total
          line_percent = 100 * lines_covered / lines_valid if lines_valid else 0.0
          print(f'Line coverage: {line_percent:.2f}%')
          if branches_valid:
              branch_percent = 100 * branches_covered / branches_valid
              print(f'Branch coverage: {branch_percent:.2f}%')
          else:
              print('Branch coverage: No branch opportunities in report')
          print(f'Overall coverage: {coverage_percent:.2f}% (pytest-cov total)')

          # Coverage threshold (adjust as needed)
          threshold = 80.0
          print(f'Threshold: {threshold}%')
          
          if coverage_percent < threshold:
              print(f'ERROR: Coverage {coverage_percent:.2f}% is below threshold {threshold}%')
              sys.exit(1)
          else:
              print(f'SUCCESS: Coverage {coverage_percent:.2f}% meets threshold {threshold}%')
          "
