name: Python Tests

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'examples/**'
      - 'benchmarks/**'
      - '.gitignore'
      - 'LICENSE'
      - '.github/copilot-instructions.md'
      - '.github/instructions/**'
    branches: [main, master]
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'examples/**'
      - 'benchmarks/**'
      - '.gitignore'
      - 'LICENSE'
      - '.github/copilot-instructions.md'
      - '.github/instructions/**'
    branches: [main, master]
  workflow_dispatch:

jobs:
  discover-tests:
    name: Discover Python test suites
    runs-on: ubuntu-latest
    outputs:
      linux-matrix: ${{ steps.matrix.outputs.linux-matrix }}
      platform-matrix: ${{ steps.matrix.outputs.platform-matrix }}
      coverage-files: ${{ steps.matrix.outputs.coverage-files }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Discover trajectories and build test matrix
        id: matrix
        run: python3 .github/scripts/python_test_matrix.py

  build-python-extension-linux:
    name: Build shared Linux Python extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install locked build tools only
        run: uv sync --locked --only-group dev

      - name: Compute native build cache key
        id: native-key
        run: echo "key=$(uv run --no-sync python .github/scripts/python_native_cache.py key)" >> "$GITHUB_OUTPUT"

      - name: Restore compiled native extension
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/python-native
          # No fallback keys: only identical native build inputs may skip compilation.
          key: ${{ steps.native-key.outputs.key }}

      - name: Cache Cargo dependencies
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: _rust -> target
          key: python-extension-release

      - name: Build native extension and editable metadata
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: uv run --no-sync python .github/scripts/python_native_cache.py build

      - name: Save compiled native extension
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/python-native
          key: ${{ steps.native-key.outputs.key }}

      - name: Share native extension with Linux tests
        uses: actions/upload-artifact@v4
        with:
          name: python-native-linux
          path: .cache/python-native
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  python-test-linux:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}${{ matrix.suite != 'regular' && format(' / {0}', matrix.suite) || '' }}
    needs: [discover-tests, build-python-extension-linux]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-tests.outputs.linux-matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run Python test suite
        uses: ./.github/actions/python-test
        with:
          python-version: ${{ matrix.python-version }}
          suite: ${{ matrix.suite }}
          path: ${{ matrix.path }}
          selector: ${{ matrix.selector || '' }}
          native-artifact: python-native-linux

  python-test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    # macOS and Windows each have one suite and do not wait for the Linux build.
    needs: discover-tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-tests.outputs.platform-matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run Python test suite
        uses: ./.github/actions/python-test
        with:
          python-version: ${{ matrix.python-version }}
          suite: ${{ matrix.suite }}
          path: ${{ matrix.path }}

  coverage-check:
    name: Coverage Threshold Check
    runs-on: ubuntu-latest
    needs: [discover-tests, python-test-linux, python-test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install locked coverage version
        # Reporting needs no ML dependencies or Rust build.
        run: |
          python - <<'PY' > coverage-requirements.txt
          import tomllib

          with open('uv.lock', 'rb') as stream:
              lock = tomllib.load(stream)
          version = next(p['version'] for p in lock['package'] if p['name'] == 'coverage')
          print(f'coverage[toml]=={version}')
          PY
          uv venv
          uv pip install -r coverage-requirements.txt

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          path: coverage-data
          merge-multiple: true

      - name: Require coverage from every suite
        env:
          EXPECTED_COVERAGE_FILES: ${{ needs.discover-tests.outputs.coverage-files }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = set(json.loads(os.environ['EXPECTED_COVERAGE_FILES']))
          actual = {path.name for path in Path('coverage-data').glob('.coverage.*')}
          if actual != expected:
              raise SystemExit(f'Coverage inputs differ: missing={expected - actual}, unexpected={actual - expected}')
          PY

      - name: Combine coverage
        run: |
          .venv/bin/python -m coverage combine coverage-data
          .venv/bin/python -m coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-ubuntu-py3.12
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage.xml
          if-no-files-found: error
          retention-days: 1

      - name: Check coverage threshold
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          import sys
          
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          
          # Get coverage percentage from XML
          line_rate = float(root.get('line-rate', 0))
          branch_rate_str = root.get('branch-rate')
          
          if branch_rate_str is not None:
              branch_rate = float(branch_rate_str)
              coverage_percent = (line_rate + branch_rate) / 2 * 100
              print(f'Line coverage: {line_rate * 100:.2f}%')
              print(f'Branch coverage: {branch_rate * 100:.2f}%')
              print(f'Overall coverage: {coverage_percent:.2f}%')
          else:
              # Fallback to line coverage only if branch coverage not available
              coverage_percent = line_rate * 100
              print(f'Line coverage: {line_rate * 100:.2f}%')
              print(f'Branch coverage: Not available (use --cov-branch flag)')
              print(f'Overall coverage: {coverage_percent:.2f}% (line coverage only)')
          
          # Coverage threshold (adjust as needed)
          threshold = 80.0
          print(f'Threshold: {threshold}%')
          
          if coverage_percent < threshold:
              print(f'ERROR: Coverage {coverage_percent:.2f}% is below threshold {threshold}%')
              sys.exit(1)
          else:
              print(f'SUCCESS: Coverage {coverage_percent:.2f}% meets threshold {threshold}%')
          "

  python-tests-complete:
    name: Python Tests Complete
    runs-on: ubuntu-latest
    needs: [discover-tests, build-python-extension-linux, python-test-linux, python-test, coverage-check]
    if: always()
    steps:
      - name: Require all Python checks to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          failed = {name: job['result'] for name, job in json.loads(os.environ['RESULTS']).items()
                    if job['result'] != 'success'}
          if failed:
              raise SystemExit(f'Python checks did not succeed: {failed}')
          PY
